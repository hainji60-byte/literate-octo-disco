<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* Background ka rang (aap chahein toh badal sakte hain) */
        }
        .redirect-link img {
            max-width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Yahan niche diye gaye links ko badal kar apne links daal dein -->
    <a href="https://blog.sentbola.xyz/top-10-world-class-hospitals-in-singapore-for-exceptional-healthcare/" class="redirect-link">
        <img src="https://i.postimg.cc/44KfMJ5b/839d27886e8fa721.jpg" alt="Clickable Image">
    </a>

</body>
</html>
